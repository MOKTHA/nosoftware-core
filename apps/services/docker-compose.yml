# HeyNXT Core Service Workers - Local Development Docker Compose
# Runs the service worker container alongside Redis and Postgres dependencies

services:
  redis:
    image: redis:7-alpine
    container_name: heynxt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: heynxt-postgres-services
    restart: unless-stopped
    environment:
      POSTGRES_USER: heynxt
      POSTGRES_PASSWORD: heynxt
      POSTGRES_DB: heynxt
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-services-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heynxt -d heynxt"]
      interval: 10s
      timeout: 5s
      retries: 5

  services-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heynxt-services-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://heynxt:heynxt@postgres:5432/heynxt
      - REDIS_URL=redis://redis:6379
      # Worker concurrency settings (adjust based on load)
      - WORKER_CONCURRENCY_WORKFLOW=5
      - WORKER_CONCURRENCY_EVENT=10
      - WORKER_CONCURRENCY_RULES=5
      - WORKER_CONCURRENCY_NOTIFICATION=3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      # Mount for development hot-reload (optional)
      - ./src:/app/src  # Only in development, not in production build
    networks:
      - heynxt-network

volumes:
  redis-data:
  postgres-services-data:

networks:
  heynxt-network:
    driver: bridge
